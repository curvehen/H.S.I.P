name: Daily HSI Predict & Monitor

on:
  schedule:
    - cron: '0 1 * * 1-5'   # 01:00 UTC = 09:00 HKT
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install TA-Lib system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make && sudo make install

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run prediction
        working-directory: src
        run: python predict.py

      - name: Generate trading signal
        working-directory: src
        run: python signal_generator.py

      - name: Run drift evaluation
        working-directory: src
        run: python evaluate_drift.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add logs/ predictions/ data/ *.flag 2>/dev/null || true
          git commit -m "auto: predict + signal + evaluate $(date +%F)" || echo "No changes to commit"
          git push

