name: Monthly Model Retrain (with safety rollback)

on:
  schedule:
    - cron: '0 2 1 * *'   # 每月 1 號 UTC 02:00（香港時間上午 10:00）
  workflow_dispatch:        # 容許人手手動觸發

permissions:
  contents: write   # 容許用內建 GITHUB_TOKEN push commit
  issues: write      # 容許自動開 issue 通知

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 350     # GitHub Actions 單一 job 上限 360 分鐘，留少許緩衝

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install TA-Lib system dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget
          wget http://prdownloads.sourceforge.net/ta-lib/ta-lib-0.4.0-src.tar.gz
          tar -xzf ta-lib-0.4.0-src.tar.gz
          cd ta-lib && ./configure --prefix=/usr && make && sudo make install

      - name: Install Python dependencies
        run: |
          pip install TA-Lib
          pip install -r requirements.txt

      - name: Backup current (pre-training) metrics as comparison baseline
        working-directory: models
        run: |
          if [ -f metrics.json ]; then
            cp metrics.json metrics_previous_backup.json
            echo "Baseline backed up from currently deployed model."
          else
            echo "No existing metrics.json found — this will be treated as a first-ever training run."
          fi

      - name: Run training
        working-directory: src
        run: python train_model.py

      - name: Compare new model vs previous deployed model
        id: compare
        working-directory: src
        run: |
          python compare_model_performance.py | tee ../models/compare_output.log
          DECISION=$(grep -oP '(?<=DECISION=)\w+' ../models/compare_output.log | tail -1)
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"

      - name: Run post-training backtest (for hit-rate data, regardless of decision)
        if: steps.compare.outputs.decision == 'proceed'
        working-directory: src
        run: |
          python run_daily_backtest.py insample 2023-01-01
          python hit_rate_tracker.py

      - name: Commit and push new model (PROCEED path)
        if: steps.compare.outputs.decision == 'proceed'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add models/
          git add predictions/backtest_hsi.csv predictions/backtest_stocks.csv 2>/dev/null || true
          git commit -m "auto: monthly retrain PROCEED $(date +%F)" || echo "No changes to commit"
          git pull --rebase origin main
          git push

      - name: Rollback new model (ROLLBACK path)
        if: steps.compare.outputs.decision == 'rollback'
        run: |
          echo "Performance regression detected — discarding newly trained model."
          git checkout -- models/
          echo "models/ reverted to last committed (previously deployed) state."

      - name: Create GitHub Issue on rollback
        if: steps.compare.outputs.decision == 'rollback'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let decisionSummary = "{}";
            try {
              decisionSummary = fs.readFileSync('models/retrain_decision.json', 'utf8');
            } catch (e) {
              decisionSummary = JSON.stringify({ error: "retrain_decision.json not found" });
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠ Monthly retrain rolled back — ${new Date().toISOString().slice(0,10)}`,
              body: "The newly trained model performed worse than the currently deployed model " +
                    "and was automatically discarded. The previous model remains in production.\n\n" +
                    "**Comparison details:**\n```json\n" + decisionSummary + "\n```\n\n" +
                    "Please review the training run manually (check for data issues, market regime " +
                    "shifts, or whether the tolerance thresholds in `compare_model_performance.py` " +
                    "need adjustment).",
              labels: ["automated", "model-retrain", "needs-review"],
            });

      - name: Upload training artifacts for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrain-artifacts-${{ github.run_id }}
          path: |
            models/metrics.json
            models/metrics_previous_backup.json
            models/retrain_decision.json
          retention-days: 90
